[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heterofold"
version = "1.0.0"
description = "Prefill-free cross-family KV cache transfer for heterogeneous multi-agent LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.9",
    "transformers>=5.10",
    "tokenizers>=0.22",
    "mistral_common>=1.11",
    "accelerate>=1.12",
    "safetensors>=0.7",
    "sentencepiece>=0.2",
    "datasets>=4.4",
    "huggingface_hub>=1.7",
    "pyarrow>=24",
    "numpy>=2.2",
    "nltk>=3.9",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
include = ["heterofold*"]
